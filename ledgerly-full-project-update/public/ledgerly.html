<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledgerly – personal money tracker</title>
<meta name="theme-color" content="#0a1118">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--font:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--head:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
--acc:#5b7cff;--acc2:#27d3c3;--in:#3ddc97;--out:#ff6b81;--warn:#ffc15a;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
:root,[data-theme=dark]{--bg:#0a1118;--bg2:#0f1a24;--card:rgba(255,255,255,.05);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.09);--text:#eaf1f4;--muted:#8a9aa6;--inp:rgba(255,255,255,.06);--shadow:0 18px 50px rgba(0,0,0,.45);--ovl:rgba(3,8,12,.66)}
[data-theme=light]{--bg:#eef3f4;--bg2:#e4ecee;--card:rgba(255,255,255,.9);--card2:#fff;--line:rgba(14,40,50,.1);--text:#0f2128;--muted:#5d727c;--inp:rgba(14,40,50,.05);--shadow:0 14px 40px rgba(20,60,80,.14);--ovl:rgba(15,33,40,.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font:15px/1.5 var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .4s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px;border-radius:8px}
.orbs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.orbs i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.28;animation:drift 26s ease-in-out infinite alternate}
.orbs i:nth-child(1){background:var(--acc);top:-18vmax;left:-12vmax}
.orbs i:nth-child(2){background:var(--acc2);bottom:-22vmax;right:-14vmax;animation-delay:-9s}
[data-theme=light] .orbs i{opacity:.16}
@keyframes drift{to{transform:translate3d(6vmax,4vmax,0) scale(1.12)}}
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
#side{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);background:linear-gradient(180deg,var(--card),transparent);backdrop-filter:blur(14px)}
.logo{display:flex;align-items:center;gap:10px;font:700 22px var(--head);padding:4px 10px 18px;letter-spacing:-.02em}
.logo b{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:18px;box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 45%,transparent)}
.nv{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;color:var(--muted);font-weight:500;text-decoration:none;position:relative;transition:color .2s,background .2s,transform .2s var(--ease)}
.nv:hover{color:var(--text);background:var(--card);transform:translateX(3px)}
.nv.on{color:var(--text);background:var(--card2);box-shadow:inset 0 0 0 1px var(--line)}
.nv.on::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:4px;border-radius:4px;background:linear-gradient(var(--acc),var(--acc2))}
.side-foot{margin-top:auto;font-size:12.5px;color:var(--muted);padding:10px;display:flex;flex-direction:column;gap:10px}
.i{flex:none}
main{min-width:0;padding:26px clamp(14px,3vw,38px) 120px;max-width:1280px;width:100%;margin:0 auto}
.view{animation:fadeIn .35s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font:700 clamp(26px,4vw,36px)/1.1 var(--head);letter-spacing:-.025em}
.head p{color:var(--muted);margin-top:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.k4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.g2b{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;backdrop-filter:blur(12px);transition:transform .3s var(--ease),border-color .3s,box-shadow .3s}
.card h3{font:600 16px var(--head);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card.hov:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.rise{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
.still .rise{animation:none}
.kpi .kl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px}
.kpi .num{display:block;font:700 clamp(22px,2.6vw,29px)/1.2 var(--head);letter-spacing:-.02em;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12.5px}
.num.in,.amt.in,.up-good{color:var(--in)}.num.out,.amt.out,.up-bad{color:var(--out)}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 30%,var(--card)),color-mix(in srgb,var(--acc2) 18%,var(--card)));border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:13px;font-weight:600;background:var(--card2);border:1px solid var(--line);transition:transform .2s var(--spring),background .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.96)}
a.btn,a.btn:link,a.btn:visited,a.btn:hover,a.btn:active{color:var(--text);text-decoration:none}
a.btn{display:flex;align-items:center;width:100%;min-height:48px;justify-content:flex-start;gap:10px;border-radius:13px}
a.btn svg{flex-shrink:0;color:currentColor}
.friends-frame-wrap{width:100%;min-width:0;overflow:visible;border:1px solid var(--line);border-radius:20px;background:var(--bg);}
.friends-frame{display:block;width:100%;height:900px;border:0;border-radius:20px;background:var(--bg);overflow:hidden}
.friends-loading{padding:20px;color:var(--muted)}
.btn.pri{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,var(--acc2)));color:#fff;border:0;box-shadow:0 8px 22px color-mix(in srgb,var(--acc) 40%,transparent)}
.btn.danger{color:var(--out)}.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:11px}.btn[disabled]{opacity:.5;pointer-events:none}
.ib{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:10px;color:var(--muted);transition:all .2s}
.ib:hover{background:var(--card2);color:var(--text);transform:scale(1.08)}.ib.d:hover{color:var(--out)}
.seg{display:inline-flex;background:var(--inp);border-radius:13px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:10px;font-weight:500;color:var(--muted);transition:all .25s var(--ease)}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.pbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.pnav{display:flex;align-items:center;gap:4px}.pnav .lbl{min-width:140px;text-align:center;font:600 16px var(--head);padding:6px 10px;border-radius:10px}
.pnav .lbl:hover{background:var(--card)}
input,select,textarea{width:100%;background:var(--inp);border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:border-color .2s,box-shadow .2s;min-width:0}
select option{background:var(--bg2);color:var(--text)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg .full{grid-column:1/-1}
.badge{font-style:normal;font-size:11.5px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--acc) 20%,transparent);color:var(--text);font-weight:500}
.badge.g{background:color-mix(in srgb,var(--in) 22%,transparent)}.badge.r{background:color-mix(in srgb,var(--out) 22%,transparent)}.badge.y{background:color-mix(in srgb,var(--warn) 25%,transparent)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .grid-l{stroke:var(--line);stroke-dasharray:3 4}
.bar{transform-origin:center bottom;transform-box:fill-box;animation:grow .8s var(--ease) both;transition:opacity .2s,filter .2s}
.bar.in{fill:var(--in)}.bar.out{fill:var(--out)}
@keyframes grow{from{transform:scaleY(0)}}
.bg:hover .bar{filter:brightness(1.25)}
.cinfo{min-height:22px;font-size:13px;color:var(--muted);margin-top:8px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.donut-w{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut{position:relative;width:170px;flex:none}
.donut svg{transform:rotate(-90deg);display:block}
.seg-c{transition:stroke-dasharray 1.1s var(--ease)}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:12px;color:var(--muted)}
.donut .mid b{font:700 16px var(--head);color:var(--text)}
.dl{flex:1;min-width:150px;display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.dl div{display:flex;align-items:center;gap:8px}.dl i{width:10px;height:10px;border-radius:4px;flex:none}.dl span{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.ins{display:flex;flex-direction:column;gap:10px}
.ins div{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border-radius:14px;background:var(--inp);font-size:14px;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i)*70ms)}
.ins em{font-style:normal;font-size:18px;line-height:1.3}
.prog{height:9px;border-radius:9px;background:var(--inp);overflow:hidden}
.prog i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc2),var(--acc));width:0;transition:width 1.1s var(--ease)}
.prog.warn i{background:var(--warn)}.prog.over i{background:var(--out)}
.bud{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;font-size:13.5px}.bud .t{display:flex;justify-content:space-between;gap:8px}
.tx{display:grid;grid-template-columns:42px 1fr auto auto;gap:12px;align-items:center;padding:10px 8px;border-radius:14px;transition:background .2s}
.tx:hover{background:var(--inp)}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c) 22%,transparent)}
.tx-m{min-width:0}.tx-m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx-m span{font-size:12.5px;color:var(--muted)}
.amt{font:600 15.5px var(--head);font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-a{display:flex;opacity:.35;transition:opacity .2s}.tx:hover .tx-a,.tx:focus-within .tx-a{opacity:1}
.dh{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:14px 8px 4px;font-weight:600;position:sticky;top:0;background:linear-gradient(var(--bg),transparent);z-index:2}
.tools{display:grid;grid-template-columns:2fr 1fr 1.3fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}.empty b{display:block;font:600 17px var(--head);color:var(--text);margin-bottom:6px}.empty .big{font-size:38px;display:block;margin-bottom:8px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
/* calendar */
.cal-h,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-h div{text-align:center;font-size:12.5px;color:var(--muted);padding:4px 0;font-weight:600}
.day{min-height:84px;border-radius:14px;background:var(--inp);padding:7px 7px 6px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;position:relative;font-size:11.5px;border:1px solid transparent;transition:transform .2s var(--spring),border-color .2s;overflow:hidden;font-variant-numeric:tabular-nums}
.day::after{content:"";position:absolute;inset:0;background:var(--out);opacity:calc(var(--h,0)*.22);pointer-events:none}
.day:hover{transform:scale(1.05);z-index:3;border-color:var(--acc)}
.day .dn{font:600 13px var(--head)}.day .di{color:var(--in);font-weight:600}.day .do{color:var(--out);font-weight:600}
.day.today{border-color:var(--acc2);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc2) 30%,transparent)}
.day.sel{background:color-mix(in srgb,var(--acc) 28%,var(--inp));border-color:var(--acc)}
.day.blank{background:none;pointer-events:none}.day .sal{position:absolute;right:5px;top:4px;font-style:normal;font-size:13px;z-index:1}
.mcards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mc{text-align:left;padding:15px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:3px;transition:transform .25s var(--spring),border-color .2s}
.mc:hover{transform:translateY(-4px);border-color:var(--acc)}.mc b{font:600 16px var(--head)}.mc small{font-size:12.5px}
/* salary + misc */
.drop{border:2px dashed var(--line);border-radius:20px;padding:26px 16px;text-align:center;color:var(--muted);transition:all .25s var(--ease);cursor:pointer;display:block}
.drop:hover,.drop.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent);transform:scale(1.01)}
.drop b{display:block;color:var(--text);font:600 17px var(--head);margin:6px 0 2px}
.drop input{display:none}
.mcol{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.sm-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font:600 17px var(--head)}
.rec{padding:11px 12px;border-radius:14px;background:var(--inp);margin-bottom:8px;font-size:13.5px}
.rec .nums{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0}.rec .nums span{color:var(--muted)}.rec .nums b{color:var(--text);display:block;font:600 15px var(--head)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);max-width:100%}
.chip.btnlike{cursor:pointer}.chip.btnlike:hover{border-color:var(--acc)}
.table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}.table th{color:var(--muted);font-weight:500;text-align:right;padding:8px}.table td{padding:9px 8px;text-align:right;border-top:1px solid var(--line)}.table th:first-child,.table td:first-child{text-align:left}
.xs{overflow-x:auto}
.sw{display:flex;gap:10px}.sw button{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));transition:transform .2s var(--spring)}.sw button:hover{transform:scale(1.2)}.sw button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--a)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}.setrow:first-of-type{border-top:0}.setrow small{display:block;color:var(--muted)}
.setrow select{width:auto}
.scan-prev{max-width:100%;max-height:340px;border-radius:16px;display:block;margin:0 auto;border:1px solid var(--line)}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.stm{display:grid;grid-template-columns:24px 82px 1fr auto auto;gap:8px;align-items:center;padding:7px 4px;border-top:1px solid var(--line);font-size:13.5px}.stm input[type=checkbox]{width:18px;height:18px}
details{margin-top:12px;color:var(--muted);font-size:13px}details pre{white-space:pre-wrap;max-height:200px;overflow:auto;margin-top:8px;font-size:12px}
/* overlay */
.ov{position:fixed;inset:0;background:var(--ovl);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;opacity:0;transition:opacity .25s;padding:14px}
.ov.on{opacity:1}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:22px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:var(--shadow);transform:translateY(24px) scale(.96);transition:transform .4s var(--spring)}
.sheet.wide{width:min(900px,100%)}.ov.on .sheet{transform:none}
.sheet h2{font:700 22px var(--head);margin-bottom:14px;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:center}
.sheet .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.tt{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--inp);padding:4px;border-radius:14px;margin-bottom:14px}
.tt button{padding:9px;border-radius:11px;font-weight:600;color:var(--muted);transition:all .25s var(--ease)}
.tt button.on.out{background:color-mix(in srgb,var(--out) 24%,transparent);color:var(--out)}.tt button.on.in{background:color-mix(in srgb,var(--in) 24%,transparent);color:var(--in)}
.amtin{font:700 30px var(--head)!important;padding:12px 14px!important}
#toasts{position:fixed;z-index:80;right:18px;bottom:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{background:var(--bg2);border:1px solid var(--line);box-shadow:var(--shadow);padding:11px 14px;border-radius:14px;display:flex;gap:12px;align-items:center;max-width:min(380px,92vw);animation:tin .45s var(--spring)}
.toast.err{border-color:var(--out)}.toast.ok{border-color:var(--in)}.toast button{color:var(--acc2);font-weight:600}
@keyframes tin{from{opacity:0;transform:translateX(40px) scale(.9)}}
#fab{position:fixed;right:22px;bottom:26px;width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;box-shadow:0 14px 34px color-mix(in srgb,var(--acc) 50%,transparent);z-index:30;transition:transform .3s var(--spring)}
#fab:hover{transform:rotate(90deg) scale(1.08)}#fab:active{transform:scale(.9)}
#tabbar{display:none}
.btn.pri,#fab{overflow:hidden}.btn.pri{position:relative}.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rp .6s ease-out;pointer-events:none}@keyframes rp{to{transform:scale(4);opacity:0}}
@media(max-width:1000px){.k4{grid-template-columns:repeat(2,1fr)}.g2,.g2b{grid-template-columns:1fr}.mcards{grid-template-columns:repeat(3,1fr)}.tools{grid-template-columns:1fr 1fr 1fr}.tools>:first-child{grid-column:1/-1}}
@media(max-width:860px){
#app{display:block}#side{display:none}
main{padding:16px 14px calc(110px + env(safe-area-inset-bottom))}
#tabbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:var(--shadow)}
#tabbar a,#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:11px;color:var(--muted);text-decoration:none;border-radius:16px;transition:all .25s var(--ease)}
#tabbar .on{color:var(--text);background:var(--card2)}
#fab{bottom:calc(92px + env(safe-area-inset-bottom));right:16px;width:54px;height:54px}
#toasts{left:12px;right:12px;bottom:calc(158px + env(safe-area-inset-bottom));align-items:stretch}
.ov{align-items:end;padding:0}.sheet{border-radius:26px 26px 0 0;width:100%!important;max-height:94vh;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.day{min-height:62px;padding:5px 4px;font-size:9.5px;border-radius:10px}.cal,.cal-h{gap:3px}.day .dn{font-size:12px}
.mcards{grid-template-columns:repeat(2,1fr)}
.tx{grid-template-columns:40px 1fr auto;gap:10px}.tx-a{grid-column:2/-1;opacity:1;justify-content:flex-end;margin-top:-6px}

<script>
'use strict';
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>ymd(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MSHORT=MONTHS.map(m=>m.slice(0,3));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lastDay=(y,m)=>new Date(y,m+1,0).getDate();
const monthLabel=k=>{const[y,m]=k.split('-').map(Number);return `${MONTHS[m-1]} ${y}`};
const sizeLabel=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const toMinor=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?Math.round(n*100):NaN};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ============ icons ============ */
const ICONS={users:'<path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M20 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>',home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',wallet:'<rect x="2" y="6" width="20" height="14" rx="3"/><path d="M2 10h20M16 15h2"/>',scan:'<path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2M7 12h10"/>',chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',plus:'<path d="M12 5v14M5 12h14"/>',edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',x:'<path d="M18 6L6 18M6 6l12 12"/>',chevL:'<path d="M15 18l-6-6 6-6"/>',chevR:'<path d="M9 18l6-6-6-6"/>',download:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',upload:'<path d="M12 15V3M7 8l5-5 5 5M4 21h16"/>',file:'<path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',moon:'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',camera:'<path d="M3 8a2 2 0 012-2h2l2-3h6l2 3h2a2 2 0 012 2v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><circle cx="12" cy="13" r="4"/>',dots:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',repeat:'<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 01-3 3H3"/>',eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',sparkle:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',down:'<path d="M7 7l10 10M17 7v10H7"/>',up:'<path d="M17 17L7 7M7 17V7h10"/>',printer:'<path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><path d="M6 14h12v8H6z"/>'};
const ic=(n,s=20)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;

/* ============ categories ============ */
const CATS={'Food & Dining':['🍜','#ff9f43','out'],'Groceries':['🛒','#9be15d','out'],'Transport':['🚕','#4cc9f0','out'],'Shopping':['🛍️','#ff7eb6','out'],'Bills & Utilities':['💡','#ffc15a','out'],'Rent & Home':['🏠','#a78bfa','out'],'Health':['💊','#ff6b6b','out'],'Entertainment':['🎬','#c77dff','out'],'Education':['📚','#2ec4b6','out'],'Travel':['✈️','#6ea8ff','out'],'Subscriptions':['🔁','#8c9bff','out'],'Investments':['📈','#3ddc97','out'],'Tax & Deductions':['🧾','#9aa8b5','out'],'Other':['📦','#a0aab4','out'],'Salary':['💼','#3ddc97','in'],'Freelance':['💻','#27d3c3','in'],'Bonus':['🎁','#ffc15a','in'],'Interest':['🏦','#b5e655','in'],'Refund':['↩️','#4cc9f0','in'],'Other income':['➕','#a0aab4','in']};
const catsOf=t=>Object.keys(CATS).filter(c=>CATS[c][2]===t);
const RULES=[[/swiggy|zomato|restaurant|cafe|coffee|pizza|burger|food|dine|dining|kitchen|bakery|biryani|tea\b|lunch|dinner|snack/i,'Food & Dining'],[/grocer|supermarket|bigbasket|blinkit|zepto|dmart|vegetable|fruit|milk|kirana|provision/i,'Groceries'],[/uber|\bola\b|rapido|metro|fuel|petrol|diesel|taxi|\bcab\b|\bbus\b|train|irctc|parking|toll|auto\b/i,'Transport'],[/amazon|flipkart|myntra|shopping|mall|fashion|cloth|apparel|electronics|shoes/i,'Shopping'],[/electric|water bill|\bgas\b|broadband|wifi|internet|recharge|airtel|\bjio\b|vodafone|bill\b|postpaid/i,'Bills & Utilities'],[/\brent\b|maintenance|society|furniture|plumber|repair/i,'Rent & Home'],[/pharma|medic|hospital|clinic|doctor|apollo|\blab\b|health|dental|insurance/i,'Health'],[/movie|cinema|game|concert|pvr|bookmyshow|party|pub\b/i,'Entertainment'],[/school|college|course|udemy|tuition|\bbook|fees|exam/i,'Education'],[/flight|hotel|airbnb|resort|trip|makemytrip|booking|holiday/i,'Travel'],[/subscription|spotify|netflix|prime|youtube|icloud|hotstar|membership|chatgpt/i,'Subscriptions'],[/\bsip\b|mutual fund|stock|zerodha|groww|invest|\bfd\b|deposit|\bppf\b|\bnps\b/i,'Investments'],[/salary|payroll|wages|stipend/i,'Salary'],[/freelance|invoice|client|consult/i,'Freelance'],[/bonus|incentive/i,'Bonus'],[/interest/i,'Interest'],[/refund|cashback|reversal/i,'Refund']];

/* ============ state + storage ============ */
const KEY='ledgerly.v1';
const defaults=()=>({tx:[],rec:[],budgets:{},salary:[],settings:{cur:'INR',theme:'dark',accent:0,weekStart:0,map:{}}});
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j){const d=defaults();return{...d,...j,settings:{...d.settings,...(j.settings||{})}}}}catch(e){}return defaults()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save – browser storage is full or blocked.','err')}}
const FILES={db:null,
 open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{const r=indexedDB.open('ledgerly-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>{this.db=r.result;res(r.result)};r.onerror=()=>rej(r.error)})},
 async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('f',mode);const rq=fn(t.objectStore('f'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)})},
 put(id,blob){return this.run('readwrite',s=>s.put(blob,id))},get(id){return this.run('readonly',s=>s.get(id))},del(id){return this.run('readwrite',s=>s.delete(id))}};
const CURS={INR:'en-IN',USD:'en-US',EUR:'de-DE',GBP:'en-GB',AED:'en-AE',AUD:'en-AU',CAD:'en-CA',SGD:'en-SG'};
let nf,cf;
function setNF(){const l=CURS[S.settings.cur]||'en-US';nf=new Intl.NumberFormat(l,{style:'currency',currency:S.settings.cur});cf=new Intl.NumberFormat(l,{notation:'compact',maximumFractionDigits:1})}
setNF();
const money=m=>nf.format(m/100);
const compact=m=>cf.format(Math.abs(m)/100);
const cc=c=>(CATS[c]||CATS.Other)[1];

/* ============ aggregation ============ */
const inR=(a,b)=>S.tx.filter(t=>t.date>=a&&t.date<=b);
const tot=l=>l.reduce((o,t)=>{if(t.type==='in')o.in+=t.amt;else o.out+=t.amt;return o},{in:0,out:0});
const byCat=l=>{const m={};l.filter(t=>t.type==='out').forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amt);return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const sortTx=l=>l.slice().sort((a,b)=>b.date.localeCompare(a.date)||S.tx.indexOf(b)-S.tx.indexOf(a));
function learnKey(s){return String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').trim().split(/\s+/).slice(0,2).join(' ')}
function guessCat(text,type='out'){const k=learnKey(text);if(!k)return type==='in'?'Other income':'Other';const m=S.settings.map[k];if(m&&CATS[m]&&CATS[m][2]===type)return m;for(const[r,c]of RULES)if(r.test(text)&&CATS[c][2]===type)return c;return type==='in'?'Other income':'Other'}
function learn(note,cat){const k=learnKey(note);if(k.length>2)S.settings.map[k]=cat}

/* ============ recurring ============ */
function addPeriod(s,freq,anchor){const d=parseYmd(s);if(freq==='daily'){d.setDate(d.getDate()+1);return ymd(d)}if(freq==='weekly'){d.setDate(d.getDate()+7);return ymd(d)}
 let y=d.getFullYear(),m=d.getMonth();if(freq==='monthly')m++;else y++;const t=new Date(y,m,1);return ymd(new Date(t.getFullYear(),t.getMonth(),Math.min(anchor,lastDay(t.getFullYear(),t.getMonth()))))}
function runRecurring(){let n=0;for(const r of S.rec){if(!r.active)continue;let guard=0;while(r.next<=today()&&guard++<500){S.tx.push({id:uid(),type:r.type,amt:r.amt,date:r.next,cat:r.cat,note:r.note,src:'recurring',ruleId:r.id});r.next=addPeriod(r.next,r.freq,r.anchor);n++}}
 if(n){save();toast(`Auto-added ${n} recurring transaction${n>1?'s':''}`,'ok')}return n}

/* ============ date + text parsing (slips, bills) ============ */
const MN='jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec';
const mIdx=s=>Math.min(11,['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(s.slice(0,3).toLowerCase()));
const fullYear=y=>y<100?2000+y:y;
function validYmd(y,m,d){y=fullYear(y);if(y<2000||y>2100||m<1||m>12||d<1||d>31)return null;const dt=new Date(y,m-1,d);return dt.getMonth()===m-1?ymd(dt):null}
function parseAnyDate(s){let m;
 if(m=s.match(/\b(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})\b/)){const r=validYmd(+m[1],+m[2],+m[3]);if(r)return r}
 if(m=s.match(/\b(\d{1,2})\s*[-\/ .]?\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*[\s,.'\-\/]*(\d{4}|\d{2})\b/i)){const r=validYmd(+m[3],mIdx(m[2])+1,+m[1]);if(r)return r}
 if(m=s.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})\b/i)){const r=validYmd(+m[3],mIdx(m[1])+1,+m[2]);if(r)return r}
 if(m=s.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/)){let d=+m[1],mo=+m[2];if(mo>12&&d<=12)[d,mo]=[mo,d];const r=validYmd(+m[3],mo,d);if(r)return r}
 return null}
const clean=t=>t.replace(/\b(rs|inr|usd|aed)\.?(?=\s*\d)/gi,' ').replace(/[₹$€£]/g,' ');
const numsIn=l=>(clean(l).match(/\d{1,3}(?:,\d{2,3})+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?/g)||[]).map(x=>parseFloat(x.replace(/,/g,''))).filter(n=>isFinite(n)&&n>0&&n<1e9);
function findAmount(text,label){const re=new RegExp('(?:'+label.source+')[^A-Za-z\\d]{0,18}(\\d[\\d,]*(?:\\.\\d{1,2})?)','i');const m=clean(text).match(re);if(!m)return null;const v=parseFloat(m[m.length-1].replace(/,/g,''));return isFinite(v)?v:null}
function parseSlip(text,fname=''){
 let net=findAmount(text,/net\s*(?:pay(?:able)?|salary|amount|take[\s-]*home|earnings)|take[\s-]*home(?:\s*pay)?|amount\s*credited|net\s*payable/);
 let gross=findAmount(text,/gross\s*(?:earnings|salary|pay|total|amount)?|total\s*earnings|total\s*gross/);
 let ded=findAmount(text,/total\s*deductions?|deductions?\s*total|total\s*dedn/);
 const found=[];if(net!=null)found.push('net');if(gross!=null)found.push('gross');if(ded!=null)found.push('deductions');
 if(net==null&&gross!=null&&ded!=null)net=+(gross-ded).toFixed(2);
 if(ded==null&&gross!=null&&net!=null&&gross>=net)ded=+(gross-net).toFixed(2);
 if(gross==null&&net!=null&&ded!=null)gross=+(net+ded).toFixed(2);
 let month=null,m;const src=text+' '+fname;
 if(m=src.match(new RegExp('\\b('+MN+')[a-z]*[\\s,.\'\\-_/]*(\\d{4}|\\d{2})\\b','i')))month=`${fullYear(+m[2])}-${pad(mIdx(m[1])+1)}`;
 else if(m=src.match(/\b(\d{4})[-_/](\d{2})\b/))month=`${m[1]}-${m[2]}`;
 else if(m=src.match(/\b(0?[1-9]|1[0-2])[-_/](\d{4})\b/))month=`${m[2]}-${pad(+m[1])}`;
 return{net,gross,ded,month,found}}
function parseBill(text){
 const lines=text.split('\n').map(s=>s.trim()).filter(s=>s.length>1);
 const KEY=/(grand\s*total|total\s*(?:amount|due|payable|paid|bill)?|amount\s*(?:due|payable|paid)|net\s*(?:amount|payable)|balance\s*due|you\s*paid|bill\s*amount)/i,NOT=/sub\s*-?total|tax|gst|vat|discount|change|tender|qty|saving/i;
 const cand=[];lines.forEach((l,i)=>{if(KEY.test(l)&&!NOT.test(l)){let a=numsIn(l);if(!a.length&&lines[i+1])a=numsIn(lines[i+1]);if(a.length)cand.push(Math.max(...a))}});
 const all=[...new Set(lines.flatMap(numsIn))].filter(n=>n>=1).sort((a,b)=>b-a);
 const decs=[...new Set(lines.flatMap(l=>(clean(l).match(/\d{1,3}(?:,\d{2,3})*\.\d{2}\b/g)||[]).map(x=>parseFloat(x.replace(/,/g,'')))))].sort((a,b)=>b-a);
 const total=cand.length?Math.max(...cand):(decs[0]??all[0]??null);
 let date=null;for(const l of lines){date=parseAnyDate(l);if(date)break}
 const merchant=(lines.find(l=>/[A-Za-z]{3,}/.test(l)&&!/invoice|receipt|tax|gst|tel|phone|date|bill no|cash memo|welcome|^www/i.test(l))||'').replace(/[^\w &'.,-]/g,'').slice(0,42).trim();
 const type=/credited|received from|refund|cashback|salary/i.test(text)&&!/debited|paid to/i.test(text)?'in':'out';
 return{total,date,merchant,type,amounts:all.slice(0,6),text,lines}}
function parseStatement(text){const rows=[];for(const l of text.split('\n')){const d=parseAnyDate(l);if(!d)continue;const a=numsIn(l.replace(/\b\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}\b|\b\d{4}[\/\-.]\d{1,2}[\/\-.]\d{1,2}\b/g,' ').replace(new RegExp('\\b\\d{1,2}\\s*[-/ ]?\\s*('+MN+')[a-z]*[\\s,.\\-/]*\\d{2,4}\\b','ig'),' '));if(!a.length)continue;
 const amt=a[0];const type=/\bcr\b|credit|deposit|received|salary|refund|interest|\+\s*\d/i.test(l)&&!/\bdr\b|debit|withdraw/i.test(l)?'in':'out';
 const desc=l.replace(/[\d,]+\.?\d*/g,' ').replace(new RegExp('\\b('+MN+')[a-z]*\\b','ig'),' ').replace(/\b(cr|dr|debit|credit)\b/ig,' ').replace(/[^\w &/@.-]/g,' ').replace(/\s+/g,' ').trim().slice(0,50);
 rows.push({on:true,date:d,desc:desc||'Statement entry',amt,type,cat:guessCat(desc,type)})}return rows.length>=3?rows:[]}

/* ============ lazy libs: pdf.js + OCR ============ */
const LIBS={pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',tess:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'};
const _ls={};const loadScript=src=>_ls[src]||(_ls[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete _ls[src];rej(new Error('Could not load '+src+'. Check your internet connection.'))};document.head.appendChild(s)}));
async function pdfjs(){await loadScript(LIBS.pdf);pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';return pdfjsLib}
async function pdfDoc(file){const lib=await pdfjs();return lib.getDocument({data:await file.arrayBuffer()}).promise}
async function pdfText(file){const pdf=await pdfDoc(file);const out=[];
 for(let p=1;p<=Math.min(pdf.numPages,6);p++){const tc=await(await pdf.getPage(p)).getTextContent();const rows={};
  tc.items.forEach(it=>{if(!it.str.trim())return;const y=Math.round(it.transform[5]/4);(rows[y]=rows[y]||[]).push(it)});
  Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>out.push(rows[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ')))}
 return out.join('\n')}
async function pdfCanvases(file,max=3,scale=2){const pdf=await pdfDoc(file);const cs=[];
 for(let p=1;p<=Math.min(pdf.numPages,max);p++){const pg=await pdf.getPage(p);const vp=pg.getViewport({scale});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;cs.push(c)}return cs}
async function ocr(canvas,onp){await loadScript(LIBS.tess);const w=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text'&&onp)onp(m.progress)}});try{return(await w.recognize(canvas)).data.text}finally{await w.terminate()}}
function prepCanvas(src,maxW=1800,enhance=true){const w0=src.naturalWidth||src.width,h0=src.naturalHeight||src.height,k=Math.min(1,maxW/w0);const c=document.createElement('canvas');c.width=Math.round(w0*k);c.height=Math.round(h0*k);const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,c.width,c.height);
 if(enhance){const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){let g=.299*p[i]+.587*p[i+1]+.114*p[i+2];g=(g-128)*1.35+128;g=g<0?0:g>255?255:g;p[i]=p[i+1]=p[i+2]=g}x.putImageData(d,0,0)}return c}
const fileImg=f=>new Promise((res,rej)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{res(i)};i.onerror=()=>rej(new Error('That image could not be opened.'));i.src=u});
const canvasBlob=(c,q=.82)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
async function readSlipFile(file,note){let text='';try{text=await pdfText(file)}catch(e){if(/load/i.test(e.message))throw e}

const shifted=(mode,d,n)=>{const x=new Date(d);if(mode==='day')x.setDate(x.getDate()+n);else if(mode==='month'){x.setDate(1);x.setMonth(x.getMonth()+n)}else{x.setDate(1);x.setFullYear(x.getFullYear()+n)}return x};

/* ============ charts ============ */
function niceMax(v){const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return(f<=1?1:f<=2?2:f<=5?5:10)*e}
function barsSVG(b,h=230){const W=680,pl=46,pb=26,pt=10,ph=h-pb-pt,pw=W-pl-6;const mx=niceMax(Math.max(100,...b.map(x=>Math.max(x.in,x.out))));const gw=pw/b.length,bw=Math.max(3,Math.min(18,gw*.36));const step=Math.ceil(26/gw);
 let s=`<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Income and expense chart">`;
 for(let i=0;i<=4;i++){const y=pt+ph-ph*i/4;s+=`<line class="grid-l" x1="${pl}" x2="${W-4}" y1="${y}" y2="${y}"/><text x="${pl-8}" y="${y+4}" text-anchor="end">${i?compact(mx*i/4):'0'}</text>`}
 b.forEach((x,i)=>{const cx=pl+gw*i+gw/2,hi=x.in?Math.max(2,x.in/mx*ph):0,ho=x.out?Math.max(2,x.out/mx*ph):0,d=Math.min(i*16,500);
  s+=`<g class="bg" data-i="${i}"><rect x="${pl+gw*i}" y="${pt}" width="${gw}" height="${ph+pb}" fill="transparent"/><rect class="bar in" x="${cx-bw-1}" y="${pt+ph-hi}" width="${bw}" height="${hi}" rx="3" style="animation-delay:${d}ms"/><rect class="bar out" x="${cx+1}" y="${pt+ph-ho}" width="${bw}" height="${ho}" rx="3" style="animation-delay:${d+40}ms"/>${i%step===0?`<text x="${cx}" y="${h-7}" text-anchor="middle">${x.label}</text>`:''}</g>`});
 return s+'</svg>'}
function bindChart(root,b,inL='Credit',outL='Debit'){const el=$('.chart',root),info=$('.cinfo',root);if(!el)return;const show=e=>{const g=e.target.closest('.bg');if(!g)return;const x=b[+g.dataset.i];info.innerHTML=`<b style="color:var(--text)">${esc(x.full)}</b> &nbsp; ${inL} <b style="color:var(--in)">${money(x.in)}</b> &nbsp; ${outL} <b style="color:var(--out)">${money(x.out)}</b>`};el.addEventListener('pointerover',show);el.addEventListener('click',show)}
function donutHTML(rows,total,label='Spent'){if(!rows.length)return`<div class="empty"><span class="big">🍩</span>No spending in this period yet.</div>`;
 let top=rows.slice(0,6);const rest=rows.slice(6).reduce((a,r)=>a+r[1],0);if(rest)top.push(['Others',rest]);let off=0;
 const segs=top.map(([c,v])=>{const p=v/total*100,d=Math.max(p-.7,.15);const s=`<circle class="seg-c" r="15.915" cx="21" cy="21" fill="none" stroke="${c==='Others'?'#8a9aa6':cc(c)}" stroke-width="5.2" stroke-dasharray="0 100" data-d="${d} ${100-d}" stroke-dashoffset="${-off}"/>`;off+=p;return s}).join('');
 return`<div class="donut-w"><div class="donut"><svg viewBox="0 0 42 42"><circle r="15.915" cx="21" cy="21" fill="none" stroke="var(--inp)" stroke-width="5.2"/>${segs}</svg><div class="mid"><span>${label}</span><b>${compact(total)}</b></div></div><div class="dl">${top.map(([c,v])=>`<div><i style="background:${c==='Others'?'#8a9aa6':cc(c)}"></i>${c==='Others'?'Others':(CATS[c][0]+' '+esc(c))}<span>${Math.round(v/total*100)}%</span></div>`).join('')}</div></div>`}
function buckets(){const d=P.ref,y=d.getFullYear(),m=d.getMonth(),idx={};S.tx.forEach(t=>(idx[t.date]=idx[t.date]||[]).push(t));const day=k=>tot(idx[k]||[]);const o=[];
 if(P.mode==='year'){for(let i=0;i<12;i++){const a=`${y}-${pad(i+1)}-01`,b=`${y}-${pad(i+1)}-31`;o.push({label:MSHORT[i],...tot(inR(a,b)),full:`${MONTHS[i]} ${y}`})}}
 else if(P.mode==='month'){for(let i=1;i<=lastDay(y,m);i++){const k=`${y}-${pad(m+1)}-${pad(i)}`;o.push({label:i,...day(k),full:parseYmd(k).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})})}}
 else{for(let i=6;i>=0;i--){const x=shifted('day',d,-i),k=ymd(x);o.push({label:x.getDate(),...day(k),full:x.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})})}}

function insights(list,t,a,b){const o=[],tdy=today(),cats=byCat(list);
 if(cats.length){const[c,v]=cats[0];o.push(['💸',`Biggest spend: <b>${CATS[c][0]} ${esc(c)}</b> – ${money(v)} (${Math.round(v/t.out*100)}% of debits).`])}

  if(P.mode==='month'&&tdy<=b)o.push(['🔮',`At this pace the month will close near <b>${money(Math.round(t.out/days*parseYmd(b).getDate()))}</b> in spending.`]);
  if(P.mode==='month'){let n=0;const spent=new Set(list.filter(x=>x.type==='out').map(x=>x.date));for(let d=parseYmd(a);d<=end;d.setDate(d.getDate()+1))if(!spent.has(ymd(d)))n++;if(n)o.push(['🌿',`<b>${n}</b> no-spend day${n>1?'s':''} so far.`])}}
 const pr=rng(P.mode,shifted(P.mode,P.ref,-1)),pt=tot(inR(pr[0],pr[1]));if(pt.out&&t.out){const ch=Math.round((t.out-pt.out)/pt.out*100);if(Math.abs(ch)>=5)o.push([ch>0?'📈':'📉',`Spending is <b>${Math.abs(ch)}% ${ch>0?'higher':'lower'}</b> than the previous ${P.mode}.`])}

async function scanFile(file){SC={stage:'working',status:'Preparing…',pct:0};render(true);

 try{let text='',preview,blob;
  if(/pdf/i.test(file.type)||/\.pdf$/i.test(file.name)){try{text=await pdfText(file)}catch(e){if(/load/i.test(e.message))throw e}const cs=await pdfCanvases(file,3,2);preview=cs[0].toDataURL('image/jpeg',.7);blob=file;
   if(text.replace(/\s/g,'').length<40){text='';for(const c of cs)text+=await ocr(prepCanvas(c,2200,true),setP)+'\n'}}
  else{const img=await fileImg(file),color=prepCanvas(img,1600,false);preview=color.toDataURL('image/jpeg',.7);SC.preview=preview;render(true);blob=await canvasBlob(color,.8);text=await ocr(prepCanvas(img,2000,true),setP)}

 catch(e){SC={stage:'idle'};render(true);toast(e.message||'Scan failed. Try a clearer photo.','err')}}

 async wipe(){if(!await confirmDlg('All entries, salary records, PDFs and settings in this browser will be erased.','Erase everything'))return;for(const id of [...S.salary.map(r=>r.fileId),...S.tx.map(t=>t.fileId)].filter(Boolean))try{await FILES.del(id)}catch(e){}S=defaults();save();setNF();applyTheme();render();toast('All data deleted')}};

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(!f)return;const row=b.closest('[data-id]');f(b,row?row.dataset.id:null,e)});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn.pri,#fab');if(!b)return;const r=b.getBoundingClientRect(),s=document.createElement('span'),d=Math.max(r.width,r.height);s.className='ripple';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=$$('.ov').pop();if(o)o.close()}else if((e.key==='n'||e.key==='N')&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!$('.ov')){e.preventDefault();ACT.add()}});
$('#fab').onclick=()=>ACT.add();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&runRecurring())render(true)});

/* ============ boot ============ */
applyTheme();buildShell();route=location.hash.slice(2);if(!VIEWS[route])route='dashboard';
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
runRecurring();render();
</script>
</body>
</html>
